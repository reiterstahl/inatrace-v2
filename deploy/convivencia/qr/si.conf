# QR_A_V2=si: los QR ya impresos abren la vitrina de la v2. Apuntan a /{idioma}/q-cd/{etiqueta}/{qr}
# (o sin idioma); la v2 registra la visita en las estadísticas de la etiqueta y abre la vitrina.
location ~ ^/(?:es|en|de|rw)/(q-cd|q|p-cd)/ {
  rewrite ^/(?:es|en|de|rw)/(.*)$ /v2/$1 redirect;
}
location ~ ^/(q-cd|q|p-cd)/ {
  return 302 /v2$request_uri;
}
