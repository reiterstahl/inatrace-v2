# Sirve la v2 bajo /v2/. La API la atiende el proxy de convivencia, no este contenedor.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  location = /salud { access_log off; return 200 "ok\n"; }

  # Archivos con hash en el nombre: se guardan un año.
  location /v2/assets/ {
    include /etc/nginx/seguridad.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA: cualquier ruta de /v2 devuelve index.html, que nunca se guarda en caché.
  location /v2/ {
    include /etc/nginx/seguridad.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /v2/index.html;
  }

  location = /v2 { return 301 /v2/; }
}
