# Cabeceras de seguridad de la v2. En nginx los add_header de un bloque no se heredan si el
# bloque define otros, así que este archivo se incluye en cada location que agrega cabeceras.
# El estilo en línea hace falta para los colores de cada producto y para MapLibre; los
# scripts, en cambio, solo pueden venir del propio sitio.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; child-src blob:; frame-src https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
